<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | NCESS Cosmetics</title>
  <link rel="stylesheet" href="../src/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <img src="../images/Ncess logo.jpg" alt="NCESS Cosmetics Logo">
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="shop.html"><i class="fas fa-store"></i> Shop</a></li>
          <li><a href="categories.html"><i class="fas fa-th"></i> Categories</a></li>
          <li><a href="about.html"><i class="fas fa-info-circle"></i> About Us</a></li>
          <li><a href="login.html"><i class="fas fa-user"></i> Login</a></li>
          <li><a href="sign up.html"><i class="fas fa-user-plus"></i> Sign Up</a></li>
          <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-card">
      <h1><i class="fas fa-envelope"></i> Contact Us</h1>
      <p>We would love to hear from you. Send us a message and we will reply shortly.</p>
      <form class="contact-form">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Your name" required>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
        <label for="message">Message</label>
        <textarea id="message" placeholder="Tell us how we can help" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-logo">
        <img src="../images/Ncess logo.jpg" alt="NCESS Cosmetics Logo">
      </div>
      <p class="footer-tagline">Luxury beauty for deeper tones</p>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="faqs.html">FAQs</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="social-icons">
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Visit our Facebook"><i class="fab fa-facebook"></i></a>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Visit our Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="Visit our Twitter"><i class="fab fa-twitter"></i></a>
      </div>
      <p>&copy; 2026 NCESS Cosmetics. All rights reserved.</p>
    </div>
  </footer>

  <script src="../src/script.js"></script>
</body>
</html>
